<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入 — 小說語音合成系統</title>
  <meta name="_csrf_token" th:content="${_csrf.token}">
  <meta name="_csrf_header" content="X-CSRF-TOKEN">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<div class="login-card">
  <h1>小說語音合成系統</h1>
  <p class="muted">Novel TTS</p>
  <div th:if="${param.error}" class="alert alert-danger">帳號或密碼錯誤</div>
  <div th:if="${param.logout}" class="alert alert-info">已登出</div>
  <form method="post" th:action="@{/do-login}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label>帳號
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label>密碼
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-primary btn-block">登入</button>
  </form>
</div>
</body>
</html>

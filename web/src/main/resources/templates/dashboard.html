<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>儀表板 — 小說語音合成系統</title>
  <meta name="_csrf_token" th:content="${_csrf.token}">
  <meta name="_csrf_header" content="X-CSRF-TOKEN">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
  <span class="brand">小說語音合成</span>
  <nav>
    <a th:href="@{/}" href="/">儀表板</a>
    <a th:href="@{/novels}" href="/novels">小說</a>
    <a th:href="@{/groups}" href="/groups">群組</a>
    <a th:href="@{/settings}" href="/settings">設定</a>
    <a th:href="@{/guide}" href="/guide">使用說明</a>
    <a th:if="${!guestMode}" th:href="@{/do-change-password}" href="/do-change-password">帳號</a>
  </nav>
  <span class="spacer"></span>
  <span class="muted" id="apiKeyState"></span>
  <form method="post" th:action="@{/do-logout}" th:if="${!guestMode}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button class="btn btn-sm" type="submit">登出</button>
  </form>
  <a class="btn btn-sm" th:if="${guestMode}" th:href="@{/login}" href="/login">登入</a>
</header>
<main>
  <h1>儀表板</h1>

  <div th:if="${passwordChanged}" class="alert alert-success">密碼已更新</div>

  <!-- 訪客模式：統計與列表由瀏覽器的 IndexedDB 計算 -->
  <div th:if="${guestMode}" class="alert alert-info">
    你的小說、角色與音檔都存在這台電腦的瀏覽器裡，不會上傳到伺服器。
    第一次使用請先到<strong>設定</strong>填入你自己的 OpenRouter API Key。
  </div>

  <div class="panel">
    <div class="row">
      <div><strong id="statNovels">0</strong> 本小說</div>
      <div><strong id="statGroups">0</strong> 個群組</div>
      <div><strong id="statAudios">0</strong> 個音檔</div>
      <div><strong id="statVoices">0</strong> 個音色</div>
    </div>
  </div>

  <h2>最近小說</h2>
  <div class="panel">
    <table>
      <thead><tr><th>標題</th><th>作者</th><th>狀態</th><th>章節</th><th>字數</th><th></th></tr></thead>
      <tbody id="novelRows">
        <tr><td colspan="6" class="muted">讀取中…</td></tr>
      </tbody>
    </table>
  </div>

  <h2 th:if="${!guestMode}">最近作業</h2>
  <div class="panel" th:if="${!guestMode}">
    <table>
      <thead><tr><th>#</th><th>類型</th><th>狀態</th><th>進度</th><th>訊息</th></tr></thead>
      <tbody>
      <tr th:each="job : ${jobs}">
        <td th:text="${job.id}"></td>
        <td th:text="${job.type}"></td>
        <td><span class="badge" th:classappend="${job.status}" th:text="${job.status}"></span></td>
        <td>
          <div class="progress"><span th:style="'width:' + ${job.percent} + '%'"></span></div>
          <span class="muted" th:text="${job.progress} + ' / ' + ${job.total}"></span>
        </td>
        <td th:text="${job.message ?: job.errorMessage}"></td>
      </tr>
      <tr th:if="${#lists.isEmpty(jobs)}"><td colspan="5" class="muted">尚無作業紀錄</td></tr>
      </tbody>
    </table>
  </div>

  <!-- 帳號模式：伺服器端渲染的小說列表 -->
  <div th:if="${!guestMode}" class="panel">
    <table>
      <thead><tr><th>標題</th><th>作者</th><th>狀態</th><th>章節</th><th>字數</th><th></th></tr></thead>
      <tbody>
      <tr th:each="novel : ${novels}">
        <td><a th:href="@{/novels/{id}(id=${novel.id})}" th:text="${novel.title}"></a></td>
        <td th:text="${novel.author} ?: '-'"></td>
        <td><span class="badge" th:classappend="${novel.status}" th:text="${novel.status}"></span></td>
        <td th:text="${novel.totalChapters}"></td>
        <td th:text="${novel.totalChars}"></td>
        <td><a class="btn btn-sm" th:href="@{/novels/{id}/characters(id=${novel.id})}">角色</a>
            <a class="btn btn-sm" th:href="@{/novels/{id}/segments(id=${novel.id})}">段落</a></td>
      </tr>
      <tr th:if="${#lists.isEmpty(novels)}"><td colspan="6" class="muted">尚無小說</td></tr>
      </tbody>
    </table>
  </div>
</main>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/db.js}"></script>
<script th:src="@{/js/logic.js}"></script>
<script th:src="@{/js/gateway.js}"></script>
<script>
/* 儀表板：訪客模式的統計與列表來自 IndexedDB */
(async function () {
  const state = document.getElementById('apiKeyState');
  if (state) {
    state.textContent = window.NovelTtsDB.credentials.has()
      ? 'OpenRouter Key：' + window.NovelTtsDB.credentials.masked()
      : '未設定 OpenRouter Key';
  }

  const body = document.getElementById('novelRows');
  if (!body) return;

  try {
    const novels = await window.NovelTtsDB.novels.list();
    const groups = await window.NovelTtsDB.groups.list();
    const audios = await window.NovelTtsDB.store.getAll('audio');

    document.getElementById('statNovels').textContent = novels.length;
    document.getElementById('statGroups').textContent = groups.length;
    document.getElementById('statAudios').textContent = audios.length;
    document.getElementById('statVoices').textContent = window.NovelTtsDB.credentials.has() ? 1 : 0;

    body.innerHTML = '';
    if (!novels.length) {
      body.appendChild(el('tr', {}, el('td', {
        colspan: '6', class: 'muted',
        text: '尚無小說。到「小說」頁匯入一本試試。',
      })));
    } else {
      novels.slice(0, 10).forEach((n) => {
        const chapters = (n.chapters || []).length;
        const chars = (n.content || '').length;
        body.appendChild(el('tr', {},
          el('td', {}, el('a', {
            href: '/novels/' + encodeURIComponent(n.id),
            text: n.title || '(未命名)',
          })),
          el('td', { text: n.author || '-' }),
          el('td', {}, el('span', {
            class: 'badge ' + (n.status || 'DRAFT'),
            text: n.status || 'DRAFT',
          })),
          el('td', { text: chapters }),
          el('td', { text: chars }),
          el('td', {},
            el('a', {
              class: 'btn btn-sm',
              href: '/novels/' + encodeURIComponent(n.id) + '/characters',
              text: '角色',
            }),
            el('a', {
              class: 'btn btn-sm',
              href: '/novels/' + encodeURIComponent(n.id) + '/segments',
              text: '段落',
            }))
        ));
      });
    }
  } catch (e) {
    console.error(e);
    body.innerHTML = '';
    body.appendChild(el('tr', {}, el('td', {
      colspan: '6', class: 'alert alert-danger',
      text: '讀取本機資料失敗：' + e.message,
    })));
  }
})();
</script>
</body>
</html>

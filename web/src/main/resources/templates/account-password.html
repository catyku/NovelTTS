<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>變更密碼 — 小說語音合成系統</title>
  <meta name="_csrf_token" th:content="${_csrf.token}">
  <meta name="_csrf_header" content="X-CSRF-TOKEN">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<div class="login-card">
  <h1>變更密碼</h1>
  <p class="muted" th:text="${username}">admin</p>

  <div th:if="${required}" class="alert alert-danger">
    目前的密碼仍是預設值，必須變更後才能繼續使用本系統。
  </div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}">錯誤</div>
  <div th:if="${success}" class="alert alert-success" th:text="${success}">已更新</div>

  <form method="post" th:action="@{/do-change-password}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label>目前密碼
      <input type="password" name="currentPassword" autocomplete="current-password" required autofocus>
    </label>
    <label>新密碼
      <input type="password" name="newPassword" autocomplete="new-password" required minlength="8">
      <small class="muted">至少 8 個字元</small>
    </label>
    <label>確認新密碼
      <input type="password" name="confirmPassword" autocomplete="new-password" required minlength="8">
    </label>
    <button type="submit" class="btn btn-primary btn-block">更新密碼</button>
  </form>

  <form method="post" th:action="@{/do-logout}" class="mt-2">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit" class="btn btn-link btn-block">登出</button>
  </form>
</div>
</body>
</html>

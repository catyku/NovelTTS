<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>設定 — 小說語音合成系統</title>
  <meta name="_csrf_token" th:content="${_csrf.token}">
  <meta name="_csrf_header" content="X-CSRF-TOKEN">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
  <span class="brand">小說語音合成</span>
  <nav>
    <a th:href="@{/}" href="/">儀表板</a>
    <a th:href="@{/novels}" href="/novels">小說</a>
    <a th:href="@{/settings}" href="/settings">設定</a>
    <a th:href="@{/account/password}" href="/account/password">帳號</a>
  </nav>
  <span class="spacer"></span>
  <form method="post" th:action="@{/do-logout}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button class="btn btn-sm" type="submit">登出</button>
  </form>
</header>
<main>
  <h1>設定</h1>

  <h2>AI Provider</h2>
  <div class="panel">
    <div class="row">
      <label>名稱<input type="text" id="pName" value="OpenRouter"></label>
      <label>Base URL<input type="text" id="pBaseUrl" value="https://openrouter.ai/api/v1"></label>
    </div>
    <div class="row">
      <label>API Key<input type="password" id="pApiKey" placeholder="留空代表不變更"></label>
      <label>逾時秒數<input type="number" id="pTimeout" value="120"></label>
    </div>
    <label>額外 Header（JSON）<textarea id="pHeaders" style="min-height:80px">{"HTTP-Referer": "http://localhost:8080", "X-Title": "novel-tts"}</textarea></label>
    <label class="row">
      <span><input type="checkbox" id="pEnabled" checked> 啟用</span>
      <span><input type="checkbox" id="pDefault" checked> 設為預設</span>
    </label>
    <button class="btn btn-primary" id="saveProvider">儲存 Provider</button>
    <button class="btn" id="testProvider">測試連線</button>
    <span id="providerMsg" class="muted"></span>
    <div id="providerList" style="margin-top:12px"></div>
  </div>

  <h2>模型</h2>
  <div class="panel">
    <div class="row">
      <label>用途
        <select id="mPurpose">
          <option value="ANALYSIS">分析（chat/completions）</option>
          <option value="TTS">合成（audio/speech）</option>
        </select>
      </label>
      <label>模型 ID<input type="text" id="mModelId" placeholder="google/gemini-3-flash"></label>
      <label>備援模型 ID<input type="text" id="mFallbackModelId" placeholder="留空表示不啟用"></label>
    </div>
    <div class="row">
      <label>Temperature<input type="number" step="0.1" id="mTemperature" value="0.2"></label>
      <label>Max Tokens<input type="number" id="mMaxTokens" value="8000"></label>
    </div>
    <label>額外參數（JSON）<textarea id="mParams" style="min-height:60px">{}</textarea></label>
    <label class="row">
      <span><input type="checkbox" id="mEnabled" checked> 啟用</span>
      <span><input type="checkbox" id="mDefault" checked> 設為預設</span>
    </label>
    <button class="btn btn-primary" id="saveModel">儲存模型</button>
    <span id="modelMsg" class="muted"></span>
    <div id="modelList" style="margin-top:12px"></div>
  </div>

  <h2>音色庫</h2>
  <div class="panel">
    <div class="row">
      <label>模型 ID<input type="text" id="vModel" value="google/gemini-3.8-flash-tts"></label>
      <label>voice_id<input type="text" id="vVoiceId" placeholder="Kore"></label>
    </div>
    <div class="row">
      <label>顯示名稱<input type="text" id="vDisplayName" placeholder="穩健女性"></label>
      <label>性別<input type="text" id="vGender" placeholder="female"></label>
      <label>語言<input type="text" id="vLanguage" placeholder="zh-TW"></label>
      <label>排序<input type="number" id="vSortOrder" value="0"></label>
    </div>
    <label>風格描述<input type="text" id="vStyleDesc" placeholder="沉穩、敘事感"></label>
    <button class="btn btn-primary" id="saveVoice">新增音色</button>
    <button class="btn" id="syncVoices">從 OpenRouter 同步音色</button>
    <span id="voiceMsg" class="muted"></span>
    <div id="voiceList" style="margin-top:12px"></div>
  </div>

  <h2>一般設定</h2>
  <div class="panel">
    <label>全域語氣指令<input type="text" id="gGlobalInstructions"></label>
    <div class="row">
      <label>旁白音色 voice_id<input type="text" id="gNarratorVoice"></label>
      <label>預設音色 voice_id<input type="text" id="gDefaultVoice"></label>
    </div>
    <div class="row">
      <label>章節切分字數上限<input type="number" id="gChapterMaxChars"></label>
      <label>TTS 併發數<input type="number" id="gTtsConcurrency"></label>
      <label>TTS group 字數上限<input type="number" id="gTtsGroupMaxChars"></label>
    </div>
    <label><input type="checkbox" id="gAutoAssignVoice"> 自動指派音色</label>
    <button class="btn btn-primary" id="saveGeneral">儲存一般設定</button>
    <span id="generalMsg" class="muted"></span>
  </div>
</main>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/settings.js}"></script>
</body>
</html>

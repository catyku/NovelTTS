<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小說 — 小說語音合成系統</title>
  <meta name="_csrf_token" th:content="${_csrf.token}">
  <meta name="_novel_id" th:content="${novel != null ? novel.id : ''}">
  <meta name="_guest_mode" th:content="${guestMode}">
  <meta name="_csrf_header" content="X-CSRF-TOKEN">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
  <span class="brand">小說語音合成</span>
  <nav>
    <a th:href="@{/}" href="/">儀表板</a>
    <a th:href="@{/novels}" href="/novels">小說</a>
    <a th:href="@{/groups}" href="/groups">群組</a>
    <a th:href="@{/settings}" href="/settings">設定</a>
    <a th:href="@{/guide}" href="/guide">使用說明</a>
    <a th:if="${!guestMode}" th:href="@{/do-change-password}" href="/do-change-password">帳號</a>
  </nav>
  <span class="spacer"></span>
  <form method="post" th:action="@{/do-logout}" th:if="${!guestMode}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button class="btn btn-sm" type="submit">登出</button>
  </form>
  <a class="btn btn-sm" th:if="${guestMode}" th:href="@{/login}" href="/login">登入</a>
</header>
<main>
  <h1 id="novelTitle">小說</h1>
  <p class="muted">
    <span id="novelAuthor">未指定作者</span> ·
    <span class="badge" id="novelStatus">NEW</span> ·
    <span id="novelStats">0 章 / 0 字</span>
  </p>

  <div class="panel">
    <button class="btn btn-primary" id="analyzeBtn">觸發 AI 分析</button>
    <button class="btn" id="synthesizeBtn">觸發語音合成</button>
    <button class="btn" id="mergeBtn">合併整本</button>
    <button class="btn" id="zipBtn">下載 ZIP</button>
    <a class="btn" id="charactersLink" href="#">角色音色</a>
    <a class="btn" id="segmentsLink" href="#">段落與音檔</a>
    <div id="jobBox" style="margin-top:12px"></div>
  </div>

  <h2>章節</h2>
  <div class="panel">
    <table>
      <thead><tr><th>#</th><th>標題</th><th>字數</th><th>段落數</th><th>狀態</th><th></th></tr></thead>
      <tbody id="chapterRows"></tbody>
    </table>
  </div>

  <h2>音檔</h2>
  <div class="panel">
    <table>
      <thead><tr><th>類型</th><th>檔名</th><th>時長</th><th>大小</th><th>音色</th><th>播放</th></tr></thead>
      <tbody id="audioRows"></tbody>
    </table>
  </div>
</main>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/db.js}"></script>
<script th:src="@{/js/logic.js}"></script>
<script th:src="@{/js/gateway.js}"></script>
<script th:src="@{/js/pipeline.js}"></script>
<script th:src="@{/js/novel-detail.js}"></script>
</body>
</html>

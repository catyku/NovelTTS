<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>角色音色 — 小說語音合成系統</title>
  <meta name="_csrf_token" th:content="${_csrf.token}">
  <meta name="_novel_id" th:content="${novel != null ? novel.id : ''}">
  <meta name="_guest_mode" th:content="${guestMode}">
  <meta name="_csrf_header" content="X-CSRF-TOKEN">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
  <span class="brand">小說語音合成</span>
  <nav>
    <a th:href="@{/}" href="/">儀表板</a>
    <a th:href="@{/novels}" href="/novels">小說</a>
    <a th:href="@{/groups}" href="/groups">群組</a>
    <a th:href="@{/settings}" href="/settings">設定</a>
    <a th:href="@{/guide}" href="/guide">使用說明</a>
    <a th:if="${!guestMode}" th:href="@{/do-change-password}" href="/do-change-password">帳號</a>
  </nav>
  <span class="spacer"></span>
  <form method="post" th:action="@{/do-logout}" th:if="${!guestMode}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button class="btn btn-sm" type="submit">登出</button>
  </form>
  <a class="btn btn-sm" th:if="${guestMode}" th:href="@{/login}" href="/login">登入</a>
</header>
<main>
  <h1>角色音色</h1>
  <p class="muted">
    <a id="novelTitle" href="#">小說</a> ·
    <span id="charCount">0 個角色</span>
  </p>

  <div class="panel">
    <button class="btn btn-primary" id="autoVoiceBtn">自動指派音色</button>
    <span id="autoMsg" class="muted"></span>
  </div>

  <div class="panel">
    <table>
      <thead>
      <tr>
        <th>角色</th><th>別名</th><th>性別</th><th>年齡</th><th>性格</th>
        <th>音色</th><th>語氣指令</th><th>段落</th><th></th>
      </tr>
      </thead>
      <tbody id="charRows"></tbody>
    </table>
  </div>
</main>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/db.js}"></script>
<script th:src="@{/js/logic.js}"></script>
<script th:src="@{/js/gateway.js}"></script>
<script th:src="@{/js/pipeline.js}"></script>
<script th:src="@{/js/characters.js}"></script>
</body>
</html>

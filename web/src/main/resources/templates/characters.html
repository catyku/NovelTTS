<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>角色音色 — 小說語音合成系統</title>
  <meta name="_csrf_token" th:content="${_csrf.token}">
  <meta name="_novel_id" th:content="${novel.id}">
  <meta name="_csrf_header" content="X-CSRF-TOKEN">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
  <span class="brand">小說語音合成</span>
  <nav>
    <a th:href="@{/}" href="/">儀表板</a>
    <a th:href="@{/novels}" href="/novels">小說</a>
    <a th:href="@{/settings}" href="/settings">設定</a>
    <a th:href="@{/do-change-password}" href="/do-change-password">帳號</a>
  </nav>
  <span class="spacer"></span>
  <form method="post" th:action="@{/do-logout}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button class="btn btn-sm" type="submit">登出</button>
  </form>
</header>
<main>
  <h1>角色音色</h1>
  <p class="muted">
    <a th:href="@{/novels/{id}(id=${novel.id})}" th:text="${novel.title}"></a> ·
    <span th:text="${#lists.size(characters)} + ' 個角色'"></span>
  </p>

  <div class="panel">
    <button class="btn btn-primary" id="autoVoiceBtn">自動指派音色</button>
    <span id="autoMsg" class="muted"></span>
  </div>

  <div class="panel">
    <table>
      <thead>
      <tr>
        <th>角色</th><th>別名</th><th>性別</th><th>年齡</th><th>性格</th>
        <th>音色</th><th>語氣指令</th><th>段落</th><th></th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="c : ${characters}">
        <td>
          <span class="voice-chip" th:style="'background:' + ${c.colorHex}"></span>
          <strong th:text="${c.name}"></strong>
          <div class="muted" th:text="${c.description} ?: ''"></div>
        </td>
        <td class="muted" th:text="${#strings.listJoin(c.aliases, ', ')}"></td>
        <td th:text="${c.gender} ?: '-'"></td>
        <td th:text="${c.ageGroup} ?: '-'"></td>
        <td th:text="${c.personality} ?: '-'"></td>
        <td>
          <select class="voice-select" th:attr="data-character-id=${c.id}">
            <option value="0">（未指定）</option>
            <option th:each="v : ${voices}" th:value="${v.id}"
                    th:text="${v.displayName} + ' (' + ${v.voiceId} + ')'"
                    th:selected="${c.ttsVoice != null && c.ttsVoice.id == v.id}"></option>
          </select>
        </td>
        <td>
          <input type="text" class="instr-input" th:value="${c.ttsInstructions}"
                 th:attr="data-character-id=${c.id}" placeholder="例如：語氣明亮">
        </td>
        <td th:text="${c.segmentCount}"></td>
        <td><button class="btn btn-sm save-char" th:attr="data-character-id=${c.id}">儲存</button></td>
      </tr>
      <tr th:if="${#lists.isEmpty(characters)}"><td colspan="9" class="muted">尚未分析出角色</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/characters.js}"></script>
</body>
</html>

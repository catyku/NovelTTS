<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小說列表 — 小說語音合成系統</title>
  <meta name="_csrf_token" th:content="${_csrf.token}">
  <meta name="_csrf_header" content="X-CSRF-TOKEN">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
  <span class="brand">小說語音合成</span>
  <nav>
    <a th:href="@{/}" href="/">儀表板</a>
    <a th:href="@{/novels}" href="/novels">小說</a>
    <a th:href="@{/settings}" href="/settings">設定</a>
    <a th:href="@{/do-change-password}" href="/do-change-password">帳號</a>
  </nav>
  <span class="spacer"></span>
  <form method="post" th:action="@{/do-logout}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button class="btn btn-sm" type="submit">登出</button>
  </form>
</header>
<main>
  <h1>小說</h1>

  <div class="panel">
    <h2>新增小說</h2>
    <div class="row">
      <label>標題<input type="text" id="title" placeholder="小說標題"></label>
      <label>作者<input type="text" id="author" placeholder="作者（可留空）"></label>
    </div>
    <label>內文
      <textarea id="content" placeholder="貼上小說全文。系統會自動依「第一章」「Chapter 1」等標題切分章節。"></textarea>
    </label>
    <button class="btn btn-primary" id="createBtn">建立</button>
    <span id="createMsg" class="muted"></span>
  </div>

  <div class="panel">
    <table>
      <thead><tr><th>標題</th><th>作者</th><th>狀態</th><th>章節</th><th>字數</th><th>建立時間</th><th></th></tr></thead>
      <tbody id="novelRows"></tbody>
    </table>
  </div>
</main>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/novels.js}"></script>
</body>
</html>
